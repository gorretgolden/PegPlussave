<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlusSave PEG System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a deep PlusSave-green rail holds the logo and role menu; the workspace reads like a ledger, and every entry carries a stamp trail (made, checked, authorised). */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --surface-2:#ECF2EE; --ink:#13211A; --muted:#58695F; --line:#D7E0D9; --line-strong:#BFCDC3;
  --brand:#0B5D3B; --brand-hover:#084A2F; --brand-ink:#FFFFFF; --brand-soft:#DBEEE2; --brand-text:#0B5D3B;
  --gold:#946A0C; --gold-soft:#F6EBCB;
  --ok:#1D7246; --ok-soft:#DCF0E3; --warn:#925C00; --warn-soft:#FAEACA; --bad:#B42318; --bad-soft:#FCE2DE; --info:#1B5898; --info-soft:#DDE8F5; --plum:#7A3E8F; --on-bad:#FFFFFF;
  --rail:#0A3826; --rail-ink:#D6EADF; --rail-muted:#8CB59F; --rail-active:#13553A; --rail-line:#15492F; --rail-gold:#E5BB50; --rail-on:#FFFFFF; --logo-bg:#FFFFFF;
  --scrim:rgba(5,22,13,.48);
  --shadow-lg:0 2px 6px rgba(8,36,22,.08),0 18px 48px rgba(8,36,22,.18);
  --r:10px;
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1410; --surface:#111C17; --surface-2:#16241D; --ink:#E2ECE6; --muted:#93A79B; --line:#21332A; --line-strong:#2F453A;
  --brand:#2E9F68; --brand-hover:#37B377; --brand-ink:#03130A; --brand-soft:#16372A; --brand-text:#5DCB93;
  --gold:#E2B54C; --gold-soft:#372C11;
  --ok:#5DCB93; --ok-soft:#133428; --warn:#E8AD45; --warn-soft:#382A0F; --bad:#F2877B; --bad-soft:#3D1B17; --info:#88B7EE; --info-soft:#162A43; --plum:#C69BD8; --on-bad:#1A0503;
  --rail:#07110D; --rail-ink:#D0E4D8; --rail-muted:#7D9A8A; --rail-active:#123324; --rail-line:#14261D; --rail-gold:#E5BB50; --rail-on:#FFFFFF; --logo-bg:#FFFFFF;
  --scrim:rgba(0,0,0,.62); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1410; --surface:#111C17; --surface-2:#16241D; --ink:#E2ECE6; --muted:#93A79B; --line:#21332A; --line-strong:#2F453A;
  --brand:#2E9F68; --brand-hover:#37B377; --brand-ink:#03130A; --brand-soft:#16372A; --brand-text:#5DCB93;
  --gold:#E2B54C; --gold-soft:#372C11;
  --ok:#5DCB93; --ok-soft:#133428; --warn:#E8AD45; --warn-soft:#382A0F; --bad:#F2877B; --bad-soft:#3D1B17; --info:#88B7EE; --info-soft:#162A43; --plum:#C69BD8; --on-bad:#1A0503;
  --rail:#07110D; --rail-ink:#D0E4D8; --rail-muted:#7D9A8A; --rail-active:#123324; --rail-line:#14261D; --rail-gold:#E5BB50; --rail-on:#FFFFFF; --logo-bg:#FFFFFF;
  --scrim:rgba(0,0,0,.62); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
code{font-family:var(--f-num);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;display:block;flex:none}
.ic.flip{transform:rotate(180deg)}
.link-btn{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;cursor:pointer;font-size:12.5px}
#app{min-height:100%}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-block:20px 16px;padding-right:14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.rail-brand{padding:4px 8px 18px;border-bottom:1px solid var(--rail-line);margin-bottom:12px;display:grid;gap:14px}
.wordmark{display:flex;flex-direction:column;line-height:1;color:var(--rail-on)}
.wm-1{font-size:25px;font-weight:500;letter-spacing:-.02em}
.wm-1 b{font-weight:800}
.wm-2{font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin-top:7px;color:var(--rail-gold);font-weight:700}
.logo-img{background:var(--logo-bg);border-radius:8px;padding:8px 10px;display:inline-flex;max-width:210px;justify-self:start}
.logo-img img{max-height:46px;width:auto;display:block}
.rail-peg{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--rail-muted);font-weight:600}
.peg-mark{font-weight:800;font-size:11.5px;letter-spacing:.16em;color:var(--rail);background:var(--rail-gold);padding:3px 7px;border-radius:4px}
.rail-nav{display:grid;gap:14px;flex:1;align-content:start}
.rail-group{display:grid;gap:2px}
.rail-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--rail-muted);font-weight:700;padding:6px 10px}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px}
.rail-item:hover{background:var(--rail-active)}
.rail-item.on{background:var(--rail-active);color:var(--rail-on);font-weight:700}
.rail-item .ic{width:18px;height:18px;opacity:.85}
.rail-item.on .ic{color:var(--rail-gold);opacity:1}
.rail-item .lock{margin-left:auto;display:flex;opacity:.55}
.rail-item .lock .ic{width:13px;height:13px}
.rail-badge{margin-left:auto;background:var(--rail-gold);color:var(--rail);font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;min-width:20px;text-align:center;line-height:18px}
.rail-item .lock + .rail-badge{margin-left:6px}
.rail-foot{font-size:11px;color:var(--rail-muted);padding:12px 10px 0;border-top:1px solid var(--rail-line);margin-top:12px;display:grid;gap:8px}
.rail-foot select{display:none;height:34px;border-radius:8px;border:1px solid var(--rail-line);background:var(--rail-active);color:var(--rail-ink);padding:0 8px;font-size:12.5px;width:100%}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:28px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.tb-title{min-width:0;flex:1}
.tb-crumb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.tb-crumb .conf{color:var(--gold);display:inline-flex;gap:4px;align-items:center}
.tb-crumb .conf .ic{width:12px;height:12px}
.tb-title h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tb-right{display:flex;align-items:center;gap:10px}
.switch-acct{display:flex;flex-direction:column;gap:2px}
.switch-acct span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.switch-acct select{height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 8px;font-size:12.5px;max-width:200px}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.me-txt{display:flex;flex-direction:column;line-height:1.25}
.me-txt b{font-size:13px} .me-txt span{font-size:11.5px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;padding:0}
.icon-btn:hover{background:var(--surface-2)}
.menu-btn{display:none}
.content{padding-block:24px 56px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;max-width:1340px;width:100%}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:55}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);height:100%;transform:translateX(-102%);transition:transform .22s ease;z-index:60;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .rail-foot select{display:block}
  .menu-btn{display:grid}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me-txt,.switch-acct{display:none}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}

/* ---------- building blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.panel > .sec{margin-bottom:12px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.005em}
.sec .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.sec-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px;min-width:0}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.cols-21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.cols2,.cols-21{grid-template-columns:minmax(0,1fr)}}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.hero-h{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.025em;margin-top:4px}
.hero-p{color:var(--muted);margin-top:4px;max-width:64ch}
.hero-act{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.kpis.k3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:470px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpis.flat .kpi{background:var(--surface-2);border-color:transparent}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;margin-top:6px;overflow-wrap:anywhere;line-height:1.2}
.cur{font-size:.58em;color:var(--muted);margin-right:5px;font-weight:500;letter-spacing:.04em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
.kpi.gold .val{color:var(--gold)} .kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)}
.group-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-bottom:-8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;min-width:680px}
.tbl.fit table{min-width:0}
.panel .tbl{border-radius:8px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{font-family:var(--f-ui)}
tfoot td{font-weight:700;border-top:1px solid var(--line-strong);background:var(--surface-2);border-bottom:0}
.cell-sub{display:block;font-size:12px;color:var(--muted)}
.row-act{white-space:nowrap;text-align:right}
.row-act .btn + .btn{margin-left:6px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%;height:42px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.7}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.muted{background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13.5px;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand-text);border-bottom-color:var(--brand)}
.tn{display:inline-block;background:var(--brand-soft);color:var(--brand-text);border-radius:999px;padding:0 7px;font-size:11px;margin-left:4px;line-height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-f{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip-f.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.conf-banner{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}
.conf-banner .ic{width:16px;height:16px;color:var(--gold);margin-top:2px}
.rules{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);border-radius:var(--r);padding:11px 14px;font-size:13px}
.rules > span{flex:1;min-width:220px}
.rules .ic{width:16px;height:16px;color:var(--brand-text)}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.warnbox .ic{width:16px;height:16px;color:var(--warn);margin-top:2px}
.badbox{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.badbox .ic{width:16px;height:16px;color:var(--bad);margin-top:2px}

/* stamp trail: the maker-checker signature */
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.trail-sep{color:var(--line-strong);display:flex}
.trail-sep .ic{width:14px;height:14px}
.stamp{display:flex;align-items:center;gap:7px;border:1.5px solid currentColor;border-radius:7px;padding:5px 10px 5px 7px;font-size:11.5px;line-height:1.3;background:var(--surface)}
.stamp b{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.stamp .st-who{display:block;color:var(--ink);font-weight:500}
.stamp .ic{width:15px;height:15px}
.stamp.done{color:var(--ok)} .stamp.no{color:var(--bad)} .stamp.wait{color:var(--muted);border-style:dashed}
.stamp.wait .st-who{color:var(--muted)}
.mini-trail{display:inline-flex;gap:3px;align-items:center}
.mt{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.mt .ic{width:11px;height:11px}
.mt.done{color:var(--ok)} .mt.no{color:var(--bad)} .mt.wait{color:var(--line-strong);border-style:dashed}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field label,.lbl-s{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:0 11px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field textarea{height:auto;min-height:80px;padding:9px 11px;resize:vertical}
.field input[readonly]{background:var(--surface-2)}
.field select:disabled{background:var(--surface-2);opacity:1}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:2px}
.form-err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:8px;font-weight:600;font-size:13px}
.maker-note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:8px}
.maker-note .ic{width:16px;height:16px;margin-top:1px;color:var(--brand-text)}
.fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.fieldset h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}

/* modal */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(620px,100%);box-shadow:var(--shadow-lg);margin:auto 0;min-width:0}
.modal.wide{width:min(920px,100%)}
.mdl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mdl-h h3{font-size:16px;font-weight:800}
.mdl-b{padding:18px 20px 20px;display:grid;gap:16px;min-width:0}
.copy-area{width:100%;min-height:220px;font-family:var(--f-num);font-size:12px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;background:var(--surface-2);color:var(--ink)}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
function D(s){const p=s.slice(0,10).split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]||1))}
function isoOf(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=D(s);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)}
function addMonths(s,n){const d=D(s);const day=d.getUTCDate();const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(day,last));return isoOf(t)}

function monthEnd(ym){const p=ym.split('-').map(Number);return isoOf(new Date(Date.UTC(p[0],p[1],0)))}
function nextYM(ym){return addMonths(ym+'-01',1).slice(0,7)}
function prevYM(ym){return addMonths(ym+'-01',-1).slice(0,7)}
function todayISO(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}
function nowStamp(){const n=new Date();return `${todayISO()}T${pad(n.getHours())}:${pad(n.getMinutes())}`}
const curYM=()=>todayISO().slice(0,7);
function fdate(s){if(!s)return '';const d=D(s);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`}
function fdm(s){const d=D(s);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`}
function fmon(ym){const p=ym.split('-').map(Number);return `${MON[p[1]-1]} ${p[0]}`}
function fstamp(s){if(!s)return '';return s.length>10?`${fdate(s)}, ${s.slice(11,16)}`:fdate(s)}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const ugx=n=>'UGX '+fmt(n);
const money=n=>`<span class="cur">UGX</span>${fmt(n)}`;
function shortUGX(n){if(n>=1e6)return (+(n/1e6).toFixed(2))+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(Math.round(n))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function given(n){const p=n.split(' ');return p[p.length-1]}

/* ---------- loan maths ---------- */
function schedule(P,ratePct,n,method,start){
  const r=ratePct/100,out=[];
  if(!(P>0)||!(n>0))return out;
  if(method==='reducing'){
    let bal=P;const inst=r===0?P/n:P*r/(1-Math.pow(1+r,-n));
    for(let i=1;i<=n;i++){const int=Math.round(bal*r);const pr=i===n?bal:Math.round(inst-int);bal-=pr;out.push({n:i,due:addMonths(start,i),principal:pr,interest:int,total:pr+int})}

    const pr=Math.round(P/n),int=Math.round(P*r);

function loanInfo(st,loan,today){

    return info;
  }
  const sched=schedule(loan.amount,loan.rate,loan.months,loan.method,loan.disbursedOn).map(x=>Object.assign(x,{paidI:0,paidP:0}));
  const reps=st.txns.filter(t=>t.type==='repayment'&&t.loanId===loan.id&&t.status==='posted').sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  let k=0;
  for(const t of reps){
    let rem=t.amount,si=0,sp=0;
    while(rem>0&&k<sched.length){
      const s=sched[k];
      const pi=Math.min(rem,s.interest-s.paidI);s.paidI+=pi;rem-=pi;si+=pi;
      const pp=Math.min(rem,s.principal-s.paidP);s.paidP+=pp;rem-=pp;sp+=pp;
      if(s.paidI>=s.interest&&s.paidP>=s.principal)k++;else break;
    }
    info.splits[t.id]={interest:si,principal:sp,date:t.date};
    info.interestPaid+=si;info.principalPaid+=sp;info.paid+=t.amount;
    info.lastPay=t.date;
  }
  info.sched=sched;info.totalDue=sum(sched.map(s=>s.total));
  const paidT=info.interestPaid+info.principalPaid;
  info.balance=Math.max(0,info.totalDue-paidT);
  info.outP=Math.max(0,loan.amount-info.principalPaid);
  const dueToDate=sum(sched.filter(s=>s.due<today).map(s=>s.total));
  info.arrears=Math.max(0,dueToDate-paidT);
  const fu=sched.find(s=>s.paidI+s.paidP<s.total);
  info.next=fu||null;
  if(fu&&fu.due<today)info.days=diffDays(today,fu.due);
  info.missed=sched.filter(s=>s.due<today&&s.paidI+s.paidP<s.total).length;
  info.state=info.balance<=0?'Closed':info.days>0?'In arrears':'Current';
  return info;
}

function interestBalAt(st,mid,date){let b=0;for(const t of st.txns){if(t.status!=='posted'||t.date>date)continue;if(t.type==='interest_posting'||t.type==='interest_payout'){const a=t.meta.alloc.find(x=>x.memberId===mid);if(a)b+=t.type==='interest_posting'?a.amount:-a.amount}else if(t.type==='exit_settlement'&&t.memberId===mid)b-=t.meta.interest}return b}
function computePosting(st,ym){
  const end=monthEnd(ym);let income=0,extInt=0;
  st.loans.forEach(l=>{if(!l.disbursedOn)return;const li=loanInfo(st,l,end);Object.values(li.splits).forEach(s=>{if(s.date.slice(0,7)===ym)income+=s.interest})});
  st.txns.forEach(t=>{if(t.type==='ext_repayment'&&t.status==='posted'&&t.date.slice(0,7)===ym)extInt+=t.meta.interest});
  const net=Math.max(0,income-extInt);const pool=Math.floor(net*st.settings.distShare/100);
  const bases=st.members.map(m=>({memberId:m.id,base:savingsAt(st,m.id,end)})).filter(b=>b.base>0);
  return {ym,income,extInt,net,pool,bases};
}

      case 'deposit':{m.sav+=t.amount;const ym=t.meta.month||t.date.slice(0,7);m.months.add(ym);m.depByMonth[ym]=(m.depByMonth[ym]||0)+t.amount;if(!m.lastDep||t.date>m.lastDep)m.lastDep=t.date;cash+=t.amount;break}
      case 'loan_booking':cash-=t.amount;break;
      case 'repayment':cash+=t.amount;break;
      case 'interest_posting':distributed+=t.amount;t.meta.alloc.forEach(a=>{if(M[a.memberId])M[a.memberId].intE+=a.amount});break;
      case 'interest_payout':t.meta.alloc.forEach(a=>{if(M[a.memberId])M[a.memberId].intP+=a.amount});cash-=t.amount;break;
      case 'exit_settlement':m.sav-=t.meta.savings;m.intP+=t.meta.interest;cash-=t.amount;break;
      case 'ext_loan':cash+=t.amount;break;
      case 'ext_repayment':cash-=t.amount;extInt+=t.meta.interest;break;
    }
  }
  let intIncome=0;Object.values(loans).forEach(li=>Object.values(li.splits).forEach(s=>intIncome+=s.interest));
  const totalSav=sum(Object.values(M).map(x=>x.sav));
  const intDue=sum(Object.values(M).map(x=>x.intE-x.intP));
  const outP=sum(Object.values(loans).filter(li=>li.loan.disbursedOn).map(li=>li.outP));
  const extOut=sum(S.extLoans.map(e=>extInfo(e).outstanding));
  const reserve=Math.round(totalSav*S.settings.reservePct/100);
  const committed=sum(S.txns.filter(t=>t.type==='loan_booking'&&t.status.startsWith('pending')).map(t=>t.amount));
  const available=Math.max(0,cash-reserve-committed);
  const running=Object.values(loans).filter(li=>li.loan.disbursedOn&&li.balance>0);
  const par30=sum(running.filter(li=>li.days>30).map(li=>li.outP));
  return {today,M,loans,cash,distributed,extInt,intIncome,totalSav,intDue,outP,extOut,reserve,committed,available,retained:intIncome-extInt-distributed,running,par30pct:outP?par30/outP*100:0};
}

function eligibility(mid,amount,months,o){
  o=o||{};const s=S.settings,m=memberById(mid),dm=DV.M[mid];
  const limit=dm.sav*s.loanMultiple,nM=dm.months.size;
  const running=S.loans.filter(l=>l.memberId===mid&&l.id!==o.excludeLoan&&(l.status==='requested'||l.status==='in_approval'||(l.disbursedOn&&DV.loans[l.id]&&DV.loans[l.id].state!=='Closed')));
  const last=prevYM(curYM());const savedLast=dm.months.has(last)||m.joined.slice(0,7)>last;
  const mx=maxTenure(amount);
  const c=[
    {label:'Active PEG member',ok:m.status==='Active'&&!m.exiting,detail:m.exiting?'Exit notice recorded':m.status},
    {label:`Saved for at least ${s.minSavingMonths} months`,ok:nM>=s.minSavingMonths,detail:`${nM} months saved`},
    {label:'No running loan or open application',ok:running.length===0,detail:running.length?running.map(l=>l.id).join(', '):'None'},
    {label:`Within ${s.loanMultiple}× savings`,ok:amount>0&&amount<=limit,detail:`Limit ${ugx(limit)}`},
    {label:'Tenure within policy',ok:months>=1&&months<=mx,detail:`Up to ${mx} months for this amount`},
    {label:'Contributions up to date',ok:savedLast,soft:true,detail:savedLast?`${fmon(last)} saved`:`No saving for ${fmon(last)}`}
  ];
  if(o.treasury){const av=DV.available+(o.addBack||0);c.push({label:'Funds available in PEG',ok:amount<=av,detail:`Available ${ugx(av)}`})}
  return c;
}
function exitCalc(mid){const dm=DV.M[mid];const run=S.loans.find(l=>l.memberId===mid&&l.disbursedOn&&DV.loans[l.id].balance>0);const offset=run?DV.loans[run.id].balance:0;return {savings:dm.sav,interest:dm.intE-dm.intP,offset,loanId:run?run.id:null,net:dm.sav+dm.intE-dm.intP-offset}}
function nextPostingMonth(){const ms=S.txns.filter(t=>t.type==='interest_posting'&&t.status!=='rejected').map(t=>t.meta.month).sort();return ms.length?nextYM(ms[ms.length-1]):'2026-01'}
function compliance(ym){ym=ym||curYM();const act=activeMembers().filter(m=>m.joined.slice(0,7)<=ym);const saved=[],pend=[],notYet=[];act.forEach(m=>{if(DV.M[m.id].depByMonth[ym])saved.push(m);else if(S.txns.some(t=>t.type==='deposit'&&t.memberId===m.id&&t.status.startsWith('pending')&&t.meta.month===ym))pend.push(m);else notYet.push(m)});return {act,saved,pend,notYet}}
function eventsForYear(y){
  const ev=[],s=S.settings;
  for(let m=1;m<=12;m++){
    const ym=`${y}-${pad(m)}`,last=+monthEnd(ym).slice(8);
    ev.push({date:`${ym}-${pad(Math.min(s.contribDay,last))}`,title:'Monthly contribution deadline',type:'deadline',rec:true});
    const dow=D(`${ym}-01`).getUTCDay(),off=(5-dow+7)%7;
    ev.push({date:`${ym}-${pad(1+off)}`,title:'Committee meeting',type:'meeting',rec:true});
    ev.push({date:monthEnd(ym),title:'Monthly interest posting',type:'finance',rec:true});
  }
  S.events.filter(e=>e.date.startsWith(y+'-')).forEach(e=>ev.push(e));
  return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function upcoming(n){const t=DV.today,y=+t.slice(0,4);return eventsForYear(y).concat(eventsForYear(y+1)).filter(e=>e.date>=t).slice(0,n)}

/* stamp trail */
function stamp(kind,verb,role,who,at,comment){
  const ic=kind==='done'?icon('check'):kind==='no'?icon('x'):icon('clock');
  const label=role?`${verb} · ${ROLE_LABEL[role]}`:verb;
  const whoTxt=who?`${esc(nameOf(who))}${at?' · '+fstamp(at):''}`:at?fstamp(at):'Pending';
  return `<div class="stamp ${kind}"${comment?` title="${esc(comment)}"`:''}>${ic}<span><b>${label}</b><span class="st-who">${whoTxt}</span>${comment?`<span class="st-who muted">“${esc(comment)}”</span>`:''}</span></div>`;
}
function checkSteps(t){
  const out=[];const c=t.checks.find(x=>x.role==='chair');
  if(c)out.push(stamp(c.action==='rejected'?'no':'done',c.action==='rejected'?'Rejected':'Checked','chair',c.userId,c.at,c.comment));
  else if(t.status!=='rejected')out.push(stamp('wait','Check','chair'));
  if(t.escalate&&!(c&&c.action==='rejected')){const p=t.checks.find(x=>x.role==='patron');if(p)out.push(stamp(p.action==='rejected'?'no':'done',p.action==='rejected'?'Rejected':'Authorised','patron',p.userId,p.at,p.comment));else if(t.status!=='rejected')out.push(stamp('wait','Authorise','patron'))}
  return out;
}
const SEP=`<span class="trail-sep">${icon('arrow')}</span>`;
function trail(t){return `<div class="trail">${[stamp('done','Made',t.maker.role,t.maker.userId,t.maker.at)].concat(checkSteps(t)).join(SEP)}</div>`}
function miniTrail(t){const c=t.checks.find(x=>x.role==='chair'),p=t.checks.find(x=>x.role==='patron');const dot=(k,lbl)=>`<span class="mt ${k}" title="${lbl}">${k==='done'?icon('check'):k==='no'?icon('x'):''}</span>`;let h=dot('done','Made by '+ROLE_LABEL[t.maker.role])+dot(c?(c.action==='rejected'?'no':'done'):'wait','Chairperson');if(t.escalate)h+=dot(p?(p.action==='rejected'?'no':'done'):'wait','Patron');return `<span class="mini-trail">${h}</span>`}
function loanTrail(l){
  const st=[];const b=bookingTxn(l);
  if(l.requestedBy===l.memberId)st.push(stamp('done','Requested','member',l.memberId,l.requestedAt));
  if(l.appraisal)st.push(stamp(l.appraisal.decision==='declined'?'no':'done',l.appraisal.decision==='declined'?'Declined':(l.requestedBy===l.memberId?'Appraised':'Booked'),'treasurer',l.appraisal.by,l.appraisal.at,l.appraisal.note));
  else if(l.status==='requested')st.push(stamp('wait','Appraise','treasurer'));
  if(b)checkSteps(b).forEach(x=>st.push(x));
  if(l.disbursedOn)st.push(stamp('done','Disbursed',null,null,l.disbursedOn));
  return `<div class="trail">${st.join(SEP)}</div>`;
}

/* ---------- dashboard ---------- */
function roleLine(r){return {member:'Here is where your PEG savings and loans stand today.',chair:'You check every Treasurer entry before it posts.',treasurer:'You make the entries. The Chairperson checks them, and large or exceptional ones go on to the Patron.',patron:'You authorise the exceptional cases: large loans, policy exceptions, external borrowing, exits and the annual payout.',accountant:'You review the books, reconcile the cash book and raise queries on entries.',secretary:'You keep the members register, the minutes and the PEG calendar.',spokesman:'You publish notices and keep members informed.',mobiliser:'You drive monthly contributions and bring new staff into PEG.',admin:'You manage user accounts, policy settings and branding. Financial records stay hidden from this account.'}[r]}

  }
  if(r==='chair'){
    rows.push(deskRow(pc.length,'Entries waiting for your check','Review','go-tab','approvals:mine'));
    rows.push(deskRow(pc.filter(t=>t.type==='membership').length,'New member registrations to approve','Review','go-tab','approvals:mine'));
    rows.push(deskRow(pp.length,'Approved by you, waiting for the Patron','View','go-tab','approvals:other'));

  }

  }

    rows.push(deskRow(null,`Cash book balance: ${ugx(DV.cash)}`,'Reconcile','go','ledger'));

  }
  if(r==='secretary'){

    rows.push(deskRow(S.members.filter(m=>m.exiting&&m.status==='Active').length,'Exit notices passed to the Treasurer','View','go','directory'));

    rows.push(deskRow(S.events.filter(e=>e.date>=today).length,'Planned PEG activities ahead','Add activity','m-event'));
  }

function groupKpis(){return `<div class="group-label">Group position</div><div class="kpis">${kpi("Members' savings",money(DV.totalSav),`${activeMembers().length} active savers`)}${kpi('Loans outstanding',money(DV.outP),`${DV.running.length} running loans`)}${kpi('Available to lend',money(DV.available),`After ${S.settings.reservePct}% reserve`,'ok')}${kpi('PAR 30',DV.par30pct.toFixed(1)+'%','Principal over 30 days late',DV.par30pct>5?'bad':'ok')}</div>`}
function noticeHTML(n,manage){return `<article class="notice"><h4>${n.pinned?icon('pin'):''}${esc(n.title)}</h4><p>${esc(n.body)}</p><div class="meta"><span>${esc(nameOf(n.by))} · ${ROLE_LABEL[n.role]||''} · ${fdate(n.date)}</span>${manage?`<button class="link-btn" data-act="pin-notice" data-id="${n.id}">${n.pinned?'Unpin':'Pin'}</button><button class="link-btn" data-act="del-notice" data-id="${n.id}">Remove</button>`:''}</div></article>`}
function evItem(e,canDel){const d=D(e.date);return `<div class="ev t-${e.type}"><div class="ev-date"><b>${d.getUTCDate()}</b><span>${MON[d.getUTCMonth()]}</span></div><div><div class="ev-type"><i class="dot"></i>${EV_TYPES[e.type]}</div><div class="ev-t">${esc(e.title)}</div>${e.notes?`<div class="muted small">${esc(e.notes)}</div>`:''}${canDel&&e.id?`<button class="link-btn" data-act="del-event" data-id="${e.id}">Remove</button>`:''}</div></div>`}
function pgDashboard(u){

/* ---------- my savings ---------- */
function interestFor(mid,ym){let x=0;S.txns.forEach(t=>{if(t.type==='interest_posting'&&t.status==='posted'&&t.meta.month===ym){const a=t.meta.alloc.find(z=>z.memberId===mid);if(a)x+=a.amount}});return x}
function pgSavings(u){
  const m=memberById(u.memberId),dm=DV.M[m.id],s=S.settings;
  let h=`<div class="kpis">${kpi('Principal savings',money(dm.sav),`${dm.months.size} months saved`)}${kpi('Interest earned',money(dm.intE),'Since you joined')}${kpi('Interest withdrawn',money(dm.intP),'Annual payouts')}${kpi('Interest available',money(dm.intE-dm.intP),`Paid out in ${MONL[s.payoutMonth-1]}`,'gold')}</div>`;
  h+=`<div class="rules">${icon('info')}<span>Save at least <b>${ugx(s.minMonthly)}</b> by the ${ordinal(s.contribDay)} of each month. Your principal stays in PEG until you leave PlusSave. Interest is shared every month and withdrawn once a year.</span><button class="btn sm" data-act="m-paynotice">${icon('upload')}Notify a payment</button></div>`;
  const y=DV.today.slice(0,4);
  const data=MON.map((mn,i)=>{const ym=`${y}-${pad(i+1)}`;return {label:mn,a:dm.depByMonth[ym]||0,b:interestFor(m.id,ym)}});
  h+=`<section class="panel">${sec(`Saved and earned in ${y}`,legend([['var(--brand)','Saved'],['var(--gold)','Interest earned']]))}${bars(data,[{key:'a',color:'var(--brand)',name:'Saved'},{key:'b',color:'var(--gold)',name:'Interest'}])}</section>`;
  const rows=[];
  S.txns.forEach(t=>{
    if(t.status==='rejected')return;
    if(t.type==='deposit'&&t.memberId===m.id)rows.push({t,desc:`Saving for ${fmon(t.meta.month)} · ${esc(t.meta.channel)}`,s:t.amount,i:0});
    else if(t.type==='interest_posting'){const a=t.meta.alloc.find(x=>x.memberId===m.id);if(a)rows.push({t,desc:`Interest share for ${fmon(t.meta.month)}`,s:0,i:a.amount})}
    else if(t.type==='interest_payout'){const a=t.meta.alloc.find(x=>x.memberId===m.id);if(a)rows.push({t,desc:`Annual interest payout ${t.meta.year}`,s:0,i:-a.amount})}
    else if(t.type==='exit_settlement'&&t.memberId===m.id)rows.push({t,desc:'Exit settlement',s:-t.meta.savings,i:-t.meta.interest});
  });
  rows.sort((a,b)=>a.t.date.localeCompare(b.t.date)||a.t.id.localeCompare(b.t.id));
  let sb=0;rows.forEach(r=>{if(r.t.status==='posted')sb+=r.s;r.sb=sb});rows.reverse();
  const f=n=>n?`<span class="${n<0?'neg':''}">${n<0?'−':''}${fmt(Math.abs(n))}</span>`:'';
  h+=`${sec('Statement',`<span class="sub">${rows.length} entries</span>`)}<div class="tbl"><table><thead><tr><th>Date</th><th>Ref</th><th>Description</th><th class="num">Savings</th><th class="num">Interest</th><th class="num">Savings balance</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fdate(r.t.date)}</td><td class="mono">${r.t.id}</td><td>${r.desc}</td><td class="num">${f(r.s)}</td><td class="num">${f(r.i)}</td><td class="num">${fmt(r.sb)}</td><td>${txnPill(r.t)}</td></tr>`).join('')||emptyRow(7,'No savings yet.')}</tbody></table></div>`;
  return h;
}

/* ---------- my loans ---------- */
function scheduleTable(li){
  const today=DV.today;
  return `<div class="tbl"><table><thead><tr><th>#</th><th>Due</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Installment</th><th class="num">Paid</th><th>Status</th></tr></thead><tbody>${li.sched.map(s=>{const p=s.paidI+s.paidP;const st=p>=s.total?['ok','Paid']:s.due<today?['bad','Overdue']:p>0?['warn','Part paid']:['muted','Upcoming'];return `<tr><td class="mono">${s.n}</td><td>${fdate(s.due)}</td><td class="num">${fmt(s.principal)}</td><td class="num">${fmt(s.interest)}</td><td class="num">${fmt(s.total)}</td><td class="num">${fmt(p)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${fmt(li.loan.amount)}</td><td class="num">${fmt(sum(li.sched.map(s=>s.interest)))}</td><td class="num">${fmt(li.totalDue)}</td><td class="num">${fmt(li.paid)}</td><td></td></tr></tfoot></table></div>`;
}
function loanCard(li,showActions){
  const l=li.loan,pct=li.totalDue?Math.round((li.totalDue-li.balance)/li.totalDue*100):0;const nx=li.next;
  return `<section class="panel stack">${sec(`${l.id} · ${ugx(l.amount)} over ${l.months} months`,loanPill(li.state)+(showActions?`<button class="btn sm" data-act="m-loan" data-id="${l.id}">Details</button>`:''),`${esc(l.purpose)} · disbursed ${fdate(l.disbursedOn)} · ${l.rate}% a month ${l.method}`)}
    <div class="kpis k3 flat">${kpi('Balance',money(li.balance),`${pct}% repaid`)}${li.arrears?kpi('In arrears',money(li.arrears),`${li.days} days overdue · ${li.missed} missed`,'bad'):kpi('Next installment',money(nx?nx.total-nx.paidI-nx.paidP:0),nx?`Due ${fdate(nx.due)}`:'')}${kpi('Interest paid',money(li.interestPaid),`of ${ugx(sum(li.sched.map(s=>s.interest)))}`)}</div>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    ${scheduleTable(li)}</section>`;
}
function bandText(){const b=S.settings.bands;let lo=0;return b.map(x=>{const t=x.upTo==null?`Above ${shortUGX(lo)}`:`Up to ${shortUGX(x.upTo)}`;lo=x.upTo||lo;return `${t}: ${Math.min(x.months,S.settings.maxMonths)} months`}).join(' · ')}
function pgLoans(u){

/* ---------- approvals ---------- */
function canAct(u,t){return (u.role==='chair'&&t.status==='pending_chair')||(u.role==='patron'&&t.status==='pending_patron')}
function kvList(pairs){return `<dl class="kv">${pairs.filter(Boolean).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`}
function allocTable(alloc,head){return `<details class="more"><summary>${head}</summary><div class="tbl fit"><table><thead><tr><th>Member</th>${alloc[0]&&alloc[0].base!=null?'<th class="num">Savings base</th>':''}<th class="num">Amount</th></tr></thead><tbody>${alloc.map(a=>`<tr><td>${esc(nameOf(a.memberId))}</td>${a.base!=null?`<td class="num">${fmt(a.base)}</td>`:''}<td class="num">${fmt(a.amount)}</td></tr>`).join('')}</tbody></table></div></details>`}
function txnDetails(t,u){
  const m=t.memberId?memberById(t.memberId):null;const who=m?`${esc(m.name)} <span class="muted">· ${m.id} · ${esc(m.dept)}</span>`:'';
  switch(t.type){
    case 'deposit':return kvList([['Member',who],['Month covered',fmon(t.meta.month)],['Channel',esc(t.meta.channel)],['Reference',`<code>${esc(t.meta.ref||'None')}</code>`],['Value date',fdate(t.date)],['Savings before',ugx(DV.M[t.memberId].sav)]]);
    case 'loan_booking':{
      const l=loanById(t.loanId),sch=schedule(t.amount,t.meta.rate,t.meta.months,t.meta.method,t.date),ti=sum(sch.map(x=>x.interest));
      let h=kvList([['Borrower',who],['Period',`${t.meta.months} months at ${t.meta.rate}% a month, ${t.meta.method}`],['Monthly installment',ugx(sch[0]?sch[0].total:0)],['Total interest',ugx(ti)],['Purpose',esc(l.purpose)],['Guarantors',l.guarantors&&l.guarantors.length?l.guarantors.map(g=>esc(nameOf(g))).join(', '):'None'],['Appraisal note',esc(l.appraisal?l.appraisal.note:'')]]);
      if(t.meta.exception)h+=`<div class="warnbox">${icon('alert')}<span>Booked as a policy exception, so it needs the Patron.</span></div>`;
      if(t.status.startsWith('pending'))h+=`<div><div class="lbl-s" style="margin-bottom:6px">Eligibility now</div>${checksHTML(eligibility(t.memberId,t.amount,t.meta.months,{treasury:true,excludeLoan:t.loanId,addBack:t.amount}))}</div>`;
      return h;}
    case 'repayment':{const li=DV.loans[t.loanId];return kvList([['Borrower',who],['Loan',`<span class="mono">${t.loanId}</span>`],['Balance now',ugx(li.balance)],['In arrears',li.arrears?`${ugx(li.arrears)} · ${li.days} days`:'No'],['Channel',esc(t.meta.channel)],['Reference',`<code>${esc(t.meta.ref||'None')}</code>`],t.meta.viaExit?['Source','Offset from exit settlement']:null])}
    case 'interest_posting':return kvList([['Month',fmon(t.meta.month)],['Loan interest collected',ugx(t.meta.income)],['External interest paid',ugx(t.meta.extInt)],['Shared to savers',`${t.meta.share}% of net`],['Pool',ugx(t.meta.pool)+(t.meta.adjusted?' (adjusted by Treasurer)':'')],['Savers credited',t.meta.alloc.length]])+allocTable(t.meta.alloc,`Show the ${t.meta.alloc.length} member shares`);
    case 'interest_payout':return kvList([['Year',t.meta.year],['Savers paid',t.meta.alloc.length],['Rule','Interest only. Principal stays in PEG.']])+allocTable(t.meta.alloc,`Show the ${t.meta.alloc.length} payouts`);
    case 'exit_settlement':return kvList([['Member',who],['Exit date',fdate(t.meta.exitDate)],['Reason',esc(t.meta.reason)],['Principal savings',ugx(t.meta.savings)],['Accumulated interest',ugx(t.meta.interest)],['Loan offset',t.meta.offset?`${ugx(t.meta.offset)} (${t.meta.loanId})`:'None'],['Net payable',`<b>${ugx(t.meta.net)}</b>`]]);

function repPAR(){
  const act=DV.running,tot=sum(act.map(li=>li.outP));
  const par=x=>sum(act.filter(li=>li.days>x).map(li=>li.outP)),pct=v=>tot?v/tot*100:0;
  const tiles=[['PAR 1',0],['PAR 30',30],['PAR 60',60],['PAR 90',90]].map(([l,x])=>{const v=par(x),p=pct(v);return kpi(l,p.toFixed(1)+'%',`${ugx(v)} at risk`,p>10?'bad':p>5?'warn':'ok')}).join('');
  const B=[['Current',li=>li.days===0,'var(--ok)'],['1–30 days',li=>li.days>=1&&li.days<=30,'var(--warn)'],['31–60 days',li=>li.days>30&&li.days<=60,'var(--warn)'],['61–90 days',li=>li.days>60&&li.days<=90,'var(--bad)'],['Over 90 days',li=>li.days>90,'var(--bad)']];
  const rows=B.map(([l,f,c])=>{const ls=act.filter(f),v=sum(ls.map(li=>li.outP));return {l,n:ls.length,v,p:pct(v),c}});
  UI.csv.par=[['Bucket','Loans','Outstanding principal (UGX)','Share of portfolio (%)'],...rows.map(r=>[r.l,r.n,r.v,r.p.toFixed(2)]),['Total',act.length,tot,'100.00']];
  const sorted=[...act].sort((a,b)=>b.days-a.days);

  for(let d=1;d<=days;d++){const iso=`${y}-${pad(mi+1)}-${pad(d)}`,ev=by[iso]||[],wd=(dow+d-1)%7;cnt+=ev.length;

  return `<div class="mon"><h4>${MONL[mi]}<span>${cnt} item${cnt===1?'':'s'}</span></h4><div class="dgrid">${['M','T','W','T','F','S','S'].map(x=>`<span class="dh">${x}</span>`).join('')}${cells}</div></div>`;

/* ---------- audit ---------- */
function pgAudit(u){
  const admin=u.role==='admin';let out=[...S.audit];
  if(!admin){
    S.txns.forEach(t=>{out.push({at:t.maker.at,userId:t.maker.userId,role:t.maker.role,action:`Made ${TYPE_LABEL[t.type].toLowerCase()} · ${ugx(t.amount)}`,ref:t.id});t.checks.forEach(c=>out.push({at:c.at,userId:c.userId,role:c.role,action:`${c.action[0].toUpperCase()+c.action.slice(1)} ${TYPE_LABEL[t.type].toLowerCase()}${c.comment?` · "${c.comment}"`:''}`,ref:t.id}));t.notes.forEach(n=>out.push({at:n.at,userId:n.userId,role:n.role,action:'Added a review note',ref:t.id}))});
    S.loans.forEach(l=>{if(l.requestedBy===l.memberId)out.push({at:l.requestedAt,userId:l.memberId,role:'member',action:`Booked a loan request · ${ugx(l.amount)}`,ref:l.id});if(l.appraisal&&l.appraisal.decision==='declined')out.push({at:l.appraisal.at,userId:l.appraisal.by,role:'treasurer',action:'Declined a loan request',ref:l.id})});
  }
  out.sort((a,b)=>b.at.localeCompare(a.at));out=out.slice(0,300);
  return `${admin?`<div class="conf-banner">${icon('lock')}<span>Financial entries are hidden from the System Owner account. The Chairperson, Patron and Accountant see the full trail.</span></div>`:''}<div class="sec"><span class="sub">${out.length} latest events · every make, check and authorise is recorded with the person, role and time</span><div class="sec-r"><label class="sr" for="au-s">Search the trail</label><input id="au-s" class="btn sm" style="font-weight:500;cursor:text" placeholder="Search" data-search="tbody.au tr"></div></div>
  <div class="tbl"><table><thead><tr><th>When</th><th>Who</th><th>Role</th><th>Action</th><th>Ref</th></tr></thead><tbody class="au">${out.map(a=>`<tr><td class="mono" style="white-space:nowrap">${a.at.replace('T',' ')}</td><td>${esc(nameOf(a.userId))}</td><td>${ROLE_LABEL[a.role]||''}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.ref)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- modals ---------- */

  o=o||{};const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-back" data-act="backdrop"><div class="modal ${o.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><header class="mdl-h"><h3 id="mdl-t">${title}</h3><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">${icon('x')}</button></header><div class="mdl-b">${body}</div></div></div>`;
  document.body.classList.add('noscroll');
  if(!o.nofocus){const f=root.querySelector('.mdl-b input:not([type=hidden]):not([readonly]),.mdl-b select,.mdl-b textarea');if(f)f.focus()}
}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.classList.remove('noscroll')}

};

/* ---------- posting logic ---------- */
function newTxn(o){const u=me();const t={id:nextId('tx','TX-',4),type:o.type,date:o.date||todayISO(),amount:Math.round(o.amount),memberId:o.memberId||null,loanId:o.loanId||null,extLoanId:o.extLoanId||null,meta:o.meta||{},escalate:!!o.escalate,status:'pending_chair',maker:{userId:u.id,role:u.role,at:nowStamp()},checks:[],notes:[]};S.txns.push(t);return t}
function postTxn(t){
  t.status='posted';const today=todayISO();
  if(t.type==='loan_booking'){const l=loanById(t.loanId);l.status='active';l.disbursedOn=today;t.date=today}
  if(t.type==='ext_loan'){const e=extById(t.extLoanId);e.status='active';e.receivedOn=t.date}
  if(t.type==='membership'){
    let n=S.members.length+1,id;do{id='PEG-'+String(n++).padStart(3,'0')}while(memberById(id));
    let un=given(t.meta.name).toLowerCase().replace(/[^a-z]/g,'')||'member',base=un,k=2;while(users().some(x=>x.username===un))un=base+(k++);
    S.members.push({id,name:t.meta.name,dept:t.meta.dept,role:'member',monthly:t.meta.monthly,joined:t.meta.joined,username:un,password:'peg2026',ext:t.meta.ext||'',status:'Active',exitDate:null,exiting:false});
    if(t.meta.prospectId){const p=S.prospects.find(x=>x.id===t.meta.prospectId);if(p)p.stage='Member'}
    t.meta.newId=id;t.meta.username=un;
  }
  if(t.type==='exit_settlement'){
    const m=memberById(t.memberId);m.status='Left';m.exitDate=t.meta.exitDate;m.exiting=false;
    if(t.meta.offset>0&&t.meta.loanId){const c=t.checks.slice();S.txns.push({id:nextId('tx','TX-',4),type:'repayment',date:t.date,amount:t.meta.offset,memberId:t.memberId,loanId:t.meta.loanId,extLoanId:null,meta:{channel:'Offset from savings',ref:t.id,viaExit:t.id},escalate:false,status:'posted',maker:Object.assign({},t.maker),checks:c,notes:[]})}
  }
}
function rejectSide(t){
  if(t.type==='loan_booking'){const l=loanById(t.loanId);if(l)l.status='rejected'}
  if(t.type==='ext_loan'){const e=extById(t.extLoanId);if(e)e.status='rejected'}
  if(t.type==='membership'&&t.meta.prospectId){const p=S.prospects.find(x=>x.id===t.meta.prospectId);if(p)p.stage='Interested'}
  if(t.type==='deposit'){const p=S.payNotices.find(x=>x.txnId===t.id);if(p)p.status='open'}
}

let toastTimer;
function toast(msg,kind){const el=document.getElementById('toast');el.className='toast '+(kind||'ok');el.innerHTML=icon(kind==='bad'?'alert':'check')+`<span>${esc(msg)}</span>`;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3600)}
function commit(msg,kind){save();render();if(msg)toast(msg,kind)}
function toCSV(rows){return rows.map(r=>r.map(v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(',')).join('\n')}
function copyText(txt){const fb=()=>{openModal('Copy the report',`<p class="muted small">Select all, copy, then paste into Excel or Google Sheets.</p><textarea class="copy-area" readonly>${esc(txt)}</textarea>`,{nofocus:true});const ta=document.querySelector('.copy-area');ta.focus();ta.select()};try{navigator.clipboard.writeText(txt).then(()=>toast('Copied. Paste into Excel or Google Sheets.'),fb)}catch(e){fb()}}

const FORM={
  login(f,fd){
    const un=String(fd.get('username')||'').trim().toLowerCase(),pw=fd.get('password');const u=users().find(x=>x.username===un);const err=document.getElementById('login-err');
    if(!u||u.password!==pw){err.textContent='That username and password do not match. Try a demo account below.';err.hidden=false;return}
    if(u.status==='Left'){err.textContent='This account is closed because the member has left PEG.';err.hidden=false;return}
    S.session=u.id;UI.page='dashboard';UI.tab={};log('Signed in');commit();
  },
  deposit(f,fd){
    const amt=+fd.get('amount');if(!(amt>=S.settings.minMonthly))return formErr(f,`The minimum monthly saving is ${ugx(S.settings.minMonthly)}.`);
    const t=newTxn({type:'deposit',date:fd.get('date'),amount:amt,memberId:fd.get('memberId'),meta:{channel:fd.get('channel'),ref:String(fd.get('ref')).trim(),month:fd.get('month')}});
    const pn=fd.get('pn');if(pn){const p=S.payNotices.find(x=>x.id===pn);if(p){p.status='recorded';p.txnId=t.id}}
    closeModal();commit(`${t.id} sent to the Chairperson for checking`);
  },
  loanbook(f,fd){
    const scope=f.dataset.scope,u=me(),s=S.settings;const mid=scope==='m'?u.memberId:fd.get('memberId');
    const amt=+fd.get('amount'),months=+fd.get('months'),purpose=fd.get('purpose'),detail=String(fd.get('detail')||'').trim();
    if(!(amt>=50000))return formErr(f,'Enter a loan amount of at least UGX 50,000.');
    const c=eligibility(mid,amt,months,{treasury:scope!=='m'}),hard=c.filter(x=>!x.ok&&!x.soft);
    const l={id:nextId('ln','LN-',3),memberId:mid,amount:amt,months,rate:s.loanRate,method:s.loanMethod,purpose:detail?`${purpose}: ${detail}`:purpose,guarantors:[fd.get('g1'),fd.get('g2')].filter(Boolean),requestedAt:nowStamp(),requestedBy:u.id,status:'requested',disbursedOn:null,appraisal:null};
    if(scope==='m'){
      if(hard.length){S.seq.ln--;return formErr(f,`This request does not meet: ${hard.map(x=>x.label.toLowerCase()).join('; ')}.`)}
      S.loans.push(l);closeModal();commit(`Loan request ${l.id} sent to the Treasurer`);
    }else{
      const note=String(fd.get('note')||'').trim();if(hard.length&&!note){S.seq.ln--;return formErr(f,'This loan is outside policy. Add a note explaining the exception; it will go to the Patron.')}
      l.status='in_approval';l.appraisal={by:u.id,at:nowStamp(),note:note||'Booked by the Treasurer. Within policy.',decision:'recommended'};S.loans.push(l);
      const t=newTxn({type:'loan_booking',amount:amt,memberId:mid,loanId:l.id,escalate:amt>s.patronThreshold||hard.length>0,meta:{months,rate:l.rate,method:l.method,purpose:l.purpose,exception:hard.length>0}});
      closeModal();commit(`${t.id} sent to the Chairperson${t.escalate?', then the Patron':''}`);
    }
  },
  appraise(f,fd,sub){
    const l=loanById(f.dataset.id),u=me();if(u.role!=='treasurer')return;const decision=sub&&sub.value?sub.value:'submit';const note=String(fd.get('note')||'').trim();
    if(decision==='decline'){if(!note)return formErr(f,'Give the reason for declining so the member knows.');l.status='declined';l.appraisal={by:u.id,at:nowStamp(),note,decision:'declined'};closeModal();return commit(`${l.id} declined`)}
    const amt=+fd.get('amount'),months=+f.querySelector('[name=months]').value;
    const c=eligibility(l.memberId,amt,months,{treasury:true,excludeLoan:l.id}),hard=c.filter(x=>!x.ok&&!x.soft);
    if(hard.length&&!note)return formErr(f,'Outside policy. Add a note explaining the exception; the Patron will review it.');
    l.amount=amt;l.months=months;l.status='in_approval';l.appraisal={by:u.id,at:nowStamp(),note:note||'Within policy. Recommended.',decision:'recommended'};
    const t=newTxn({type:'loan_booking',amount:amt,memberId:l.memberId,loanId:l.id,escalate:amt>S.settings.patronThreshold||hard.length>0,meta:{months,rate:l.rate,method:l.method,purpose:l.purpose,exception:hard.length>0}});
    closeModal();commit(`${t.id} sent to the Chairperson${t.escalate?', then the Patron':''}`);
  },
  repay(f,fd){
    const lid=fd.get('loanId'),li=DV.loans[lid],amt=+fd.get('amount'),room=li.balance-pendingRepay(lid);
    if(!(amt>0))return formErr(f,'Enter the amount received.');
    if(amt>room)return formErr(f,`The most that can be applied is ${ugx(room)} (balance less repayments already waiting).`);
    const t=newTxn({type:'repayment',date:fd.get('date'),amount:amt,memberId:li.loan.memberId,loanId:lid,meta:{channel:fd.get('channel'),ref:String(fd.get('ref')).trim()}});
    closeModal();commit(`${t.id} sent to the Chairperson for checking`);
  },
  interest(f,fd){
    const ym=fd.get('month');if(S.txns.some(t=>t.type==='interest_posting'&&t.meta.month===ym&&t.status!=='rejected'))return formErr(f,`Interest for ${fmon(ym)} is already posted or waiting for checks.`);
    const c=computePosting(S,ym),pool=Math.max(0,Math.round(+fd.get('pool')||0));if(!pool)return formErr(f,'There is no interest to share for this month.');
    const alloc=allocate(pool,c.bases);if(!alloc.length)return formErr(f,'No member had savings at the end of this month.');
    const t=newTxn({type:'interest_posting',date:monthEnd(ym)<=todayISO()?monthEnd(ym):todayISO(),amount:sum(alloc.map(a=>a.amount)),meta:{month:ym,income:c.income,extInt:c.extInt,share:S.settings.distShare,pool,alloc,adjusted:pool!==c.pool}});
    closeModal();commit(`${t.id} sent to the Chairperson for checking`);
  },
  ext(f,fd){
    const lender=String(fd.get('lender')).trim(),amt=+fd.get('amount'),rate=+fd.get('rate'),months=+fd.get('months');
    if(!lender||!(amt>0)||!(months>0))return formErr(f,'Enter the lender, amount and number of months.');
    const e={id:nextId('ext','EXT-',3),lender,amount:amt,rate,months,purpose:String(fd.get('purpose')||'').trim()||'General liquidity',status:'in_approval',receivedOn:null};S.extLoans.push(e);
    const t=newTxn({type:'ext_loan',date:fd.get('date'),amount:amt,extLoanId:e.id,escalate:true,meta:{lender,rate,months,purpose:e.purpose}});
    closeModal();commit(`${t.id} sent to the Chairperson, then the Patron`);
  },
  extrepay(f,fd){
    const e=extById(fd.get('extId')),p=+fd.get('principal')||0,i=+fd.get('interest')||0,info=extInfo(e);
    if(p+i<=0)return formErr(f,'Enter the principal and interest paid.');if(p>info.outstanding)return formErr(f,`Principal cannot exceed the outstanding ${ugx(info.outstanding)}.`);
    const t=newTxn({type:'ext_repayment',date:fd.get('date'),amount:p+i,extLoanId:e.id,meta:{principal:p,interest:i,ref:String(fd.get('ref')||'').trim()}});
    closeModal();commit(`${t.id} sent to the Chairperson for checking`);
  },
  payout(f,fd){
    const y=fd.get('year');if(S.txns.some(t=>t.type==='interest_payout'&&t.meta.year===y&&t.status!=='rejected'))return formErr(f,`The ${y} payout is already posted or waiting for approval.`);
    const alloc=activeMembers().map(m=>({memberId:m.id,amount:DV.M[m.id].intE-DV.M[m.id].intP})).filter(a=>a.amount>0);if(!alloc.length)return formErr(f,'No member has interest to withdraw.');
    const t=newTxn({type:'interest_payout',amount:sum(alloc.map(a=>a.amount)),escalate:true,meta:{year:y,alloc}});
    closeModal();commit(`${t.id} sent to the Chairperson, then the Patron`);
  },
  exit(f,fd){
    const mid=fd.get('memberId'),c=exitCalc(mid);
    if(c.net<0)return formErr(f,'The loan balance is more than the savings. Recover the difference first.');
    if(S.txns.some(t=>t.type==='exit_settlement'&&t.memberId===mid&&t.status.startsWith('pending')))return formErr(f,'A settlement for this member is already waiting for approval.');
    const t=newTxn({type:'exit_settlement',amount:c.savings+c.interest,memberId:mid,escalate:true,meta:{savings:c.savings,interest:c.interest,offset:c.offset,loanId:c.loanId,net:c.net,exitDate:fd.get('exitDate'),reason:fd.get('reason')}});
    closeModal();commit(`${t.id} sent to the Chairperson, then the Patron`);
  },
  paynotice(f,fd){
    const amt=+fd.get('amount');if(!(amt>=S.settings.minMonthly))return formErr(f,`The minimum monthly saving is ${ugx(S.settings.minMonthly)}.`);
    const p={id:nextId('pn','PN-',3),memberId:me().memberId,amount:amt,date:fd.get('date'),channel:fd.get('channel'),ref:String(fd.get('ref')).trim(),month:fd.get('month'),status:'open',at:nowStamp()};S.payNotices.push(p);log(`Sent payment notice ${ugx(amt)}`,p.id);
    closeModal();commit('Payment notice sent to the Treasurer');
  },
  note(f,fd){const t=txnById(f.dataset.id),u=me(),text=String(fd.get('text')||'').trim();if(!text)return;t.notes.push({userId:u.id,role:u.role,at:nowStamp(),text});save();render();mTxn(t.id);toast('Note added')},
  exitnotice(f,fd){const m=memberById(f.dataset.id);m.exiting=true;m.exitNote=String(fd.get('note')).trim();log(`Recorded exit notice for ${m.name}`,m.id);closeModal();commit(`${m.name}'s exit notice passed to the Treasurer`)},
  addmember(f,fd){

  editmember(f,fd){const m=memberById(f.dataset.id),monthly=+fd.get('monthly');if(!(monthly>=S.settings.minMonthly))return formErr(f,`The pledge must be at least ${ugx(S.settings.minMonthly)}.`);m.name=String(fd.get('name')).trim()||m.name;m.dept=fd.get('dept');m.ext=String(fd.get('ext')||'').trim();m.monthly=monthly;log(`Updated member details for ${m.name}`,m.id);closeModal();commit('Member details saved')},

  notice(f,fd){const u=me();const n={id:nextId('nt','NT-',3),title:String(fd.get('title')).trim(),body:String(fd.get('body')).trim(),by:u.id,role:u.role,date:todayISO(),pinned:!!fd.get('pinned')};S.notices.push(n);log(`Published notice "${n.title}"`,n.id);closeModal();commit('Notice published to all members')},
  minutes(f,fd){const n={id:nextId('mn','MN-',3),title:String(fd.get('title')).trim(),date:fd.get('date'),kind:fd.get('kind'),attendance:String(fd.get('attendance')||'').trim()||'Not recorded',summary:String(fd.get('summary')).trim(),decisions:String(fd.get('decisions')||'').split('\n').map(x=>x.trim()).filter(Boolean),by:me().id};S.minutes.push(n);log(`Recorded minutes "${n.title}"`,n.id);closeModal();commit('Minutes saved')},
  prospect(f,fd){const p={id:nextId('pr','PR-',3),name:String(fd.get('name')).trim(),dept:fd.get('dept'),stage:'Approached',note:String(fd.get('note')||'').trim()};S.prospects.push(p);log(`Added prospect ${p.name}`,p.id);closeModal();commit('Prospect added')},
  settings(f,fd){
    const n=k=>+fd.get(k);const ns={minMonthly:n('minMonthly'),contribDay:Math.min(31,Math.max(1,n('contribDay'))),payoutMonth:n('payoutMonth'),distShare:Math.min(100,Math.max(0,n('distShare'))),reservePct:Math.min(100,Math.max(0,n('reservePct'))),loanRate:n('loanRate'),loanMethod:fd.get('loanMethod'),maxMonths:Math.max(1,n('maxMonths')),loanMultiple:Math.max(1,n('loanMultiple')),minSavingMonths:Math.max(0,n('minSavingMonths')),patronThreshold:n('patronThreshold'),bands:[{upTo:n('b1u'),months:n('b1m')},{upTo:n('b2u'),months:n('b2m')},{upTo:null,months:n('b3m')}]};
    if(!(ns.bands[0].upTo<ns.bands[1].upTo))return formErr(f,'The second amount band must be larger than the first.');
    if([ns.minMonthly,ns.loanRate,ns.patronThreshold].some(x=>!(x>=0)))return formErr(f,'Check the amounts; they must be zero or more.');
    S.settings=ns;log('Updated policy settings');commit('Settings saved. They apply to new entries.');
  }
};
const CHANGE={
  switch(t){S.session=t.value;UI.page='dashboard';UI.tab={};UI.menu=false;log('Signed in (demo switch)');commit()},
  role(t){const m=memberById(t.dataset.id);const old=m.role;m.role=t.value;log(`Changed ${m.name}'s role from ${ROLE_LABEL[old]} to ${ROLE_LABEL[m.role]}`,m.id);commit(`${m.name} is now ${ROLE_LABEL[m.role]}`)},
  logo(t){const file=t.files&&t.files[0];if(!file)return;if(file.size>600*1024)return toast('That file is over 600 KB. Use a smaller PNG or SVG.','bad');const r=new FileReader();r.onload=()=>{S.logo=r.result;log('Uploaded the PlusSave logo');commit('Logo updated on every menu')};r.readAsDataURL(file)},
  'rep-year'(t){UI.repYear=+t.value;render()},
  'ledger-month'(t){UI.ledgerMonth=t.value;render()},
  'dir-dept'(t){UI.filters.dept=t.value;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn)fn(el,e)});
document.addEventListener('submit',e=>{const f=e.target;const fn=FORM[f.dataset.form];if(fn){e.preventDefault();fn(f,new FormData(f),e.submitter)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.search){const q=t.value.toLowerCase();document.querySelectorAll(t.dataset.search).forEach(r=>{r.hidden=q&&!r.textContent.toLowerCase().includes(q)});return}const f=t.closest&&t.closest('form[data-live]');if(f&&LIVE[f.dataset.live])LIVE[f.dataset.live](f,t)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.change&&CHANGE[t.dataset.change]){CHANGE[t.dataset.change](t);return}const f=t.closest&&t.closest('form[data-live]');if(f&&LIVE[f.dataset.live]&&t.tagName==='SELECT')LIVE[f.dataset.live](f,t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal()});
render();
</script>

</body>
</html>
